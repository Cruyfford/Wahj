name = "wahj-live"
main = "worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

rules = [{ type = "Text", globs = ["app.html", "lib/*.txt"], fallthrough = true }]

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub", "Room"]

[[r2_buckets]]
binding = "REC"
bucket_name = "wahj-recordings"

[ai]
binding = "AI"
