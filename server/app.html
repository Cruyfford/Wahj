<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06050A"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Wahj Live · وهج</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{
  --bg:#06050A;--bg2:#0D0B14;--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.09);--txt:#F4F2FF;--mut:#9C97B5;--dim:#5E5A73;
  --a1:#7C5CFF;--a2:#FF4D8D;--a3:#00D1FF;--ok:#2EE59D;--warn:#FFB800;--bad:#FF4D5E;
  --grad:linear-gradient(120deg,#7C5CFF 0%,#FF4D8D 55%,#FF9A3D 100%);
  --grad2:linear-gradient(135deg,#00D1FF,#7C5CFF);
  --r:22px;--st:max(env(safe-area-inset-top,0px),var(--nst,0px));--sb:max(env(safe-area-inset-bottom,0px),var(--nsb,0px));
  --font:"Readex Pro",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);overflow:hidden;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input,textarea,button,select{font:inherit;color:inherit}
input,textarea{-webkit-user-select:text;user-select:text}
button{background:none;border:0;cursor:pointer}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hide{display:none!important}

/* aurora background */
#aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(70px);opacity:.55}
#aurora i{position:absolute;border-radius:50%;animation:drift 18s ease-in-out infinite alternate}
#aurora i:nth-child(1){width:55vw;height:55vw;background:#5b3dff;top:5%;left:10%}
#aurora i:nth-child(2){width:45vw;height:45vw;background:#ff2f7d;top:35%;right:0;animation-delay:-6s;opacity:.7}
#aurora i:nth-child(3){width:40vw;height:40vw;background:#00b8ff;bottom:0;left:25%;animation-delay:-12s;opacity:.45}
@keyframes drift{to{transform:translate(8%,-6%) scale(1.15)}}

.view{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(110px + var(--sb))}
.scroll::-webkit-scrollbar{display:none}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:calc(var(--st) + 14px) 18px 12px;position:relative;z-index:3}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:26px;letter-spacing:-.5px}
.brand b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo{width:36px;height:36px;border-radius:12px;background:var(--grad);display:grid;place-items:center;
  box-shadow:0 0 24px rgba(255,77,141,.55),inset 0 0 0 1px rgba(255,255,255,.25)}
.logo svg{width:20px;height:20px;stroke:#fff;stroke-width:2.4}
.sp{flex:1}
.ibtn{width:42px;height:42px;border-radius:14px;background:var(--card);display:grid;place-items:center;
  border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:.15s}
.ibtn:active{transform:scale(.92)}
.h1{font-size:28px;font-weight:800;letter-spacing:-.6px}
.h2{font-size:19px;font-weight:700;margin:22px 2px 12px;display:flex;align-items:center;gap:8px}
.mut{color:var(--mut)}.small{font-size:12.5px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;margin:0 -16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);
  font-size:14px;color:var(--mut);transition:.2s;white-space:nowrap}
.chip.on{background:#fff;color:#111;border-color:#fff;font-weight:600}

/* cards */
.feat{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:16/10;background:#15121f;margin-top:8px;
  box-shadow:0 20px 60px -20px rgba(124,92,255,.6)}
.feat img,.card .th img{width:100%;height:100%;object-fit:cover;display:block}
.feat .ov{position:absolute;inset:0;background:linear-gradient(0deg,rgba(6,5,10,.92),rgba(6,5,10,0) 60%);
  display:flex;flex-direction:column;justify-content:flex-end;padding:18px}
.feat .t{font-size:21px;font-weight:700;line-height:1.3}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border-radius:20px;overflow:hidden;background:var(--card);border:1px solid var(--line);transition:.2s}
.card:active{transform:scale(.97)}
.card .th{position:relative;aspect-ratio:9/12;background:linear-gradient(160deg,#1d1730,#0f0c18)}
.card .th.land{aspect-ratio:16/10}
.card .meta{padding:10px 11px 12px}
.card .tt{font-size:14px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ph{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;opacity:.85}
.live{position:absolute;top:10px;inset-inline-start:10px;display:flex;gap:6px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:9px;font-size:11.5px;font-weight:700;
  background:rgba(0,0,0,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.badge.red{background:#FF2D55;box-shadow:0 0 16px rgba(255,45,85,.7)}
.badge.red::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
.badge.co{background:var(--grad2)}
@keyframes pulse{50%{opacity:.25}}
.who{display:flex;align-items:center;gap:8px;margin-top:8px}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none;
  box-shadow:0 0 0 2px rgba(255,255,255,.08)}
.av.lg{width:84px;height:84px;font-size:34px;box-shadow:0 0 0 3px rgba(255,255,255,.1),0 0 40px rgba(124,92,255,.5)}
.av.md{width:40px;height:40px;font-size:16px}
.empty{text-align:center;padding:60px 20px;color:var(--mut)}
.empty .big{font-size:60px;margin-bottom:12px;filter:drop-shadow(0 0 20px rgba(124,92,255,.6))}

/* bottom nav */
.nav{position:fixed;z-index:5;bottom:calc(14px + var(--sb));left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:6px;padding:8px;border-radius:28px;background:rgba(20,17,30,.72);
  border:1px solid var(--line);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);
  box-shadow:0 20px 50px rgba(0,0,0,.5)}
.nav button{width:58px;height:50px;border-radius:20px;display:grid;place-items:center;color:var(--mut);transition:.2s}
.nav button.on{color:#fff;background:rgba(255,255,255,.08)}
.nav .go{width:66px;height:54px;background:var(--grad);color:#fff;border-radius:20px;box-shadow:0 8px 30px rgba(255,77,141,.55)}
.nav .go svg{width:26px;height:26px}

/* forms */
.field{margin:10px 0}
.field label{display:block;font-size:13px;color:var(--mut);margin:0 4px 7px}
.inp{width:100%;padding:15px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);outline:0;font-size:16px;transition:.2s}
.inp:focus{border-color:rgba(124,92,255,.7);box-shadow:0 0 0 4px rgba(124,92,255,.18)}
.btn{width:100%;padding:16px;border-radius:18px;font-weight:700;font-size:16.5px;display:flex;align-items:center;justify-content:center;gap:10px;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--grad);color:#fff;box-shadow:0 10px 30px -6px rgba(255,77,141,.6)}
.btn.g{background:var(--card2);border:1px solid var(--line)}
.btn.d{background:rgba(255,77,94,.14);color:#ff7b88;border:1px solid rgba(255,77,94,.3)}
.btn[disabled]{opacity:.5;pointer-events:none}
.row{display:flex;gap:10px;align-items:center}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;padding:11px 6px;border-radius:12px;font-size:14px;color:var(--mut);font-weight:600}
.seg button.on{background:#fff;color:#111}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:10px 0}
.tg{display:flex;align-items:center;gap:12px;padding:13px 2px}
.tg+.tg{border-top:1px solid var(--line)}
.tg .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card2);flex:none}
.tg .tx{flex:1}.tg .tx b{display:block;font-size:15px;font-weight:600}.tg .tx span{font-size:12.5px;color:var(--mut)}
.sw{width:50px;height:30px;border-radius:99px;background:#2a2638;position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}
.sw.on::after{inset-inline-start:23px}

/* auth */
.auth{justify-content:center;padding:calc(var(--st) + 20px) 24px calc(var(--sb) + 20px)}
.hero{text-align:center;margin-bottom:28px}
.hero .logo{width:84px;height:84px;border-radius:28px;margin:0 auto 18px}
.hero .logo svg{width:44px;height:44px}
.hero h1{font-size:40px;font-weight:800;letter-spacing:-1px}
.hero p{color:var(--mut);margin-top:6px;font-size:15px;line-height:1.6}

/* ===== watch ===== */
#watch{background:#000}
.stage{position:absolute;inset:0;overflow:hidden;background:#000}
.stage.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97) 2}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-7px,3px) rotate(-.6deg)}40%,60%{transform:translate(7px,-3px) rotate(.6deg)}}
.vt{position:absolute;overflow:hidden;background:#05040a;transition:all .35s cubic-bezier(.2,.8,.2,1)}
.vt video{width:100%;height:100%;object-fit:contain;display:block}
.vt .nm{position:absolute;bottom:8px;inset-inline-start:8px;font-size:11.5px}
.vt.mini{border-radius:16px;border:2px solid rgba(255,255,255,.18);box-shadow:0 10px 30px rgba(0,0,0,.6);z-index:2}
.vt.mini video{object-fit:cover}
.cam{position:absolute;width:112px;height:112px;border-radius:50%;overflow:hidden;z-index:3;touch-action:none;
  box-shadow:0 0 0 3px rgba(255,255,255,.85),0 0 30px rgba(124,92,255,.8);background:#111}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.priv{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:rgba(8,6,16,.78);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);text-align:center;padding:20px}
.priv .lk{width:72px;height:72px;border-radius:24px;background:var(--grad2);display:grid;place-items:center;box-shadow:0 0 40px rgba(0,209,255,.5)}
.priv .lk svg{width:34px;height:34px;stroke:#fff}
.priv b{font-size:18px}.priv span{color:var(--mut);font-size:13.5px}
.wtop{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;gap:10px;
  padding:calc(var(--st) + 10px) 14px 30px;background:linear-gradient(180deg,rgba(0,0,0,.65),transparent)}
.pill{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 5px;border-radius:99px;background:rgba(0,0,0,.45);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12)}
[dir=rtl] .pill{padding:5px 5px 5px 12px}
.pill{min-width:0;max-width:52%}.pill>div:last-child{min-width:0}.pill .n,.pill .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .n{font-size:14px;font-weight:700;line-height:1.1}.pill .s{font-size:11px;color:#cfcae6}
.fbtn{padding:7px 13px;border-radius:99px;background:#fff;color:#111;font-size:12.5px;font-weight:700}
.fbtn.on{background:rgba(255,255,255,.14);color:#fff}
.stat{font-size:12px;font-weight:600;padding:6px 10px;border-radius:99px;background:rgba(0,0,0,.45);display:flex;gap:5px;align-items:center;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.stat svg{width:14px;height:14px}
.lat{color:var(--ok)}

/* floating chat over the stream */
.chatov{position:absolute;z-index:5;bottom:calc(var(--sb) + 76px);inset-inline-start:0;width:min(78%,420px);max-height:42%;
  overflow:hidden;padding:0 12px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;
  -webkit-mask-image:linear-gradient(0deg,#000 75%,transparent);mask-image:linear-gradient(0deg,#000 75%,transparent);pointer-events:none}
.cm{align-self:flex-start;max-width:100%;padding:7px 12px;border-radius:16px;background:rgba(10,8,18,.5);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:14px;line-height:1.45;animation:cin .3s ease;
  border:1px solid rgba(255,255,255,.06);pointer-events:auto;word-wrap:break-word}
.cm b{font-weight:700;margin-inline-end:6px}
.cm .tag{font-size:10px;padding:1px 6px;border-radius:6px;background:var(--grad);margin-inline-end:5px;vertical-align:1px;font-weight:700}
.cm.sys{background:rgba(124,92,255,.28);font-size:13px}
.cm.fx{background:linear-gradient(90deg,rgba(255,77,141,.45),rgba(124,92,255,.35))}
.cm.fade{opacity:0;transition:opacity 1.2s}
@keyframes cin{from{transform:translateY(10px);opacity:0}}
.pinned{position:absolute;z-index:6;top:calc(var(--st) + 66px);inset-inline:14px;padding:10px 14px;border-radius:16px;
  background:rgba(124,92,255,.32);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font-size:13.5px;display:flex;gap:8px;align-items:center}

/* bottom action bar */
.wbar{position:absolute;z-index:7;bottom:0;left:0;right:0;display:flex;gap:8px;align-items:center;
  padding:10px 12px calc(var(--sb) + 12px);background:linear-gradient(0deg,rgba(0,0,0,.7),transparent)}
.cin{flex:1;min-width:0;display:flex;align-items:center;background:rgba(255,255,255,.12);border-radius:99px;padding:0 6px 0 16px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1)}
[dir=rtl] .cin{padding:0 16px 0 6px}
.cin input{flex:1;background:none;border:0;outline:0;padding:12px 0;font-size:15px;min-width:0}
.rbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);flex:none;font-size:20px;transition:.12s}
.rbtn:active{transform:scale(.85)}
.rbtn.hot{background:var(--grad);box-shadow:0 0 20px rgba(255,77,141,.6)}

/* hype meter */
.hype{position:absolute;z-index:6;inset-inline-end:12px;top:50%;transform:translateY(-50%);width:12px;height:170px;border-radius:99px;
  background:rgba(255,255,255,.1);overflow:hidden;backdrop-filter:blur(10px)}
.hype i{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg,#7C5CFF,#FF4D8D,#FFB800);border-radius:99px;transition:height .6s;box-shadow:0 0 18px #ff4d8d}
.hypel{position:absolute;z-index:6;inset-inline-end:4px;top:calc(50% + 94px);font-size:11px;font-weight:800;width:28px;text-align:center}
.train{position:absolute;z-index:9;left:50%;top:30%;transform:translate(-50%,-50%);font-size:34px;font-weight:900;text-align:center;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px rgba(255,77,141,.8));
  animation:train 2.6s ease forwards;pointer-events:none;white-space:nowrap}
@keyframes train{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}15%{transform:translate(-50%,-50%) scale(1.15);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
.floaty{position:absolute;z-index:8;bottom:120px;inset-inline-end:24px;font-size:30px;pointer-events:none;animation:floaty 2.4s ease-out forwards}
@keyframes floaty{to{transform:translate(var(--dx),-340px) scale(1.4);opacity:0}}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:8;pointer-events:none}
.flash{position:absolute;inset:0;z-index:8;background:#fff;pointer-events:none;animation:flash .6s ease-out forwards}
@keyframes flash{0%,20%{opacity:.85}10%,30%{opacity:.1}100%{opacity:0}}
.fxname{position:absolute;z-index:9;top:calc(var(--st) + 120px);left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:99px;
  background:rgba(0,0,0,.55);backdrop-filter:blur(14px);font-weight:700;font-size:14px;animation:cin .3s;white-space:nowrap}

/* poll card */
.poll{position:absolute;z-index:7;top:calc(var(--st) + 70px);inset-inline-end:14px;width:min(270px,72%);padding:14px;border-radius:20px;
  background:rgba(14,11,24,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);animation:cin .3s}
.poll .q{font-weight:700;font-size:14.5px;margin-bottom:10px;display:flex;gap:6px}
.po{position:relative;display:block;width:100%;text-align:start;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.08);margin-top:7px;overflow:hidden;font-size:13.5px}
.po i{position:absolute;inset-block:0;inset-inline-start:0;background:linear-gradient(90deg,rgba(124,92,255,.6),rgba(255,77,141,.5));transition:width .4s}
.po span{position:relative;display:flex;justify-content:space-between;gap:8px}
.po.me{box-shadow:inset 0 0 0 1.5px #fff}
.poll .tm{font-size:11px;color:var(--mut);margin-top:8px}

/* sheets */
.scrim{display:none;position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);opacity:0;transition:.25s;backdrop-filter:blur(2px)}
.scrim.on{opacity:1}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:86vh;overflow-y:auto;background:#14111d;border-radius:28px 28px 0 0;
  padding:10px 18px calc(var(--sb) + 22px);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);border-top:1px solid var(--line)}
.sheet.on{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:#3a3548;margin:4px auto 14px}
.sheet h3{font-size:20px;font-weight:800;margin-bottom:12px}
.fxgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fxb{aspect-ratio:1;border-radius:20px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:30px}
.fxb small{font-size:11px;color:var(--mut)}
.fxb:active{transform:scale(.92);background:var(--card2)}
.emoji{display:flex;justify-content:space-between;margin:6px 0 16px}
.emoji button{font-size:32px;width:52px;height:52px;border-radius:16px}
.emoji button:active{transform:scale(.8)}

/* toast */
#toast{position:fixed;z-index:60;left:50%;top:calc(var(--st) + 10px);transform:translate(-50%,-30px);opacity:0;pointer-events:none;padding:12px 18px;border-radius:16px;
  background:rgba(30,26,44,.95);border:1px solid var(--line);font-size:14px;font-weight:600;transition:.35s cubic-bezier(.2,.8,.2,1);
  max-width:90%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#toast.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}

/* studio */
.lvcard{border-radius:26px;padding:18px;background:linear-gradient(140deg,rgba(124,92,255,.3),rgba(255,77,141,.18));border:1px solid rgba(255,255,255,.12);position:relative;overflow:hidden}
.lvcard .big{font-size:38px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.kpi{background:rgba(0,0,0,.25);border-radius:16px;padding:10px;text-align:center}
.kpi b{display:block;font-size:20px;font-weight:800}.kpi span{font-size:11.5px;color:#d6d1ee}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.act{border-radius:20px;background:var(--card);border:1px solid var(--line);padding:14px 4px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;color:var(--mut);position:relative}
.act svg{color:#fff}
.act.on{background:rgba(46,229,157,.12);border-color:rgba(46,229,157,.4);color:var(--ok)}
.act .dot{position:absolute;top:8px;inset-inline-end:10px;min-width:18px;height:18px;border-radius:9px;background:var(--a2);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.sl{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.sm{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:14px;background:var(--card)}

.chl .st.failed,.chl .st.rejected{background:rgba(255,77,94,.15);color:#ff7b88}
.banner{position:absolute;z-index:9;left:50%;top:calc(var(--st) + 80px);transform:translateX(-50%);padding:12px 18px;border-radius:18px;
  background:linear-gradient(120deg,rgba(255,184,0,.9),rgba(255,77,141,.9));font-weight:700;font-size:14px;text-align:center;
  box-shadow:0 10px 40px rgba(255,77,141,.5);animation:cin .4s;max-width:88%}

.spin{width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#fff;animation:sp 1s linear infinite;position:absolute;left:50%;top:50%;margin:-22px}

.offline{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mut);text-align:center;padding:30px}

}

/* password */
.pwrap{position:relative}
.pw{-webkit-text-security:disc;text-security:disc;font-family:var(--font);letter-spacing:1px}
.pw.show{-webkit-text-security:none;text-security:none;letter-spacing:0}
.eye{position:absolute;top:50%;transform:translateY(-50%);right:8px;width:40px;height:40px;display:grid;place-items:center;color:var(--mut)}
.pwrap .inp{padding-right:52px;padding-left:16px}
.link{color:#b9a8ff;font-size:14px;font-weight:600;padding:8px;display:block;margin:6px auto 0}

/* games */
.gi{border-radius:22%;object-fit:cover;background:#221d33;flex:none;display:block}
.gpick{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--card);border:1px solid var(--line);width:100%;text-align:start}
.gpick .gi{width:52px;height:52px}
.gpick .ph2{width:52px;height:52px;border-radius:22%;display:grid;place-items:center;background:var(--card2);font-size:24px;flex:none}
.ggrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px;margin-top:10px}
.gg{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:#d6d1ee;text-align:center;line-height:1.25}
.gg .gi{width:100%;aspect-ratio:1;max-width:72px}
.gg span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;width:100%}
.gg:active{transform:scale(.94)}
.gbadge{position:absolute;bottom:8px;inset-inline-start:8px;display:flex;align-items:center;gap:6px;padding:4px 9px 4px 4px;border-radius:12px;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:11.5px;font-weight:700;max-width:calc(100% - 16px)}
[dir=rtl] .gbadge{padding:4px 4px 4px 9px}
.gbadge .gi{width:24px;height:24px;border-radius:7px}
.gbadge span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thbg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(18px) saturate(1.4);transform:scale(1.3);opacity:.7}
.thic{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:38%;max-width:96px;aspect-ratio:1;border-radius:22%;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.gchip{display:flex;align-items:center;gap:7px;padding:5px 12px 5px 5px}
[dir=rtl] .gchip{padding:5px 5px 5px 12px}
.gchip .gi{width:26px;height:26px;border-radius:8px}
.gchip b{font-size:11px;background:#FF2D55;border-radius:7px;padding:1px 6px;color:#fff}
.pill .gi{width:16px;height:16px;border-radius:5px;display:inline-block;vertical-align:-3px;margin-inline-end:4px}

/* speed test */
.gauge{position:relative;width:240px;height:240px;margin:10px auto 0}
.gauge svg{width:240px;height:240px;transform:rotate(135deg)}
.gauge .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .v b{font-size:46px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.gauge .v span{color:var(--mut);font-size:13px}
.sres{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.sres .kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:start}
.sres .kpi b{font-size:24px}
.sres .kpi span{color:var(--mut)}
.verdict{margin-top:14px;padding:14px;border-radius:18px;background:rgba(46,229,157,.1);border:1px solid rgba(46,229,157,.35);font-size:14px;line-height:1.7}
.verdict.w{background:rgba(255,184,0,.1);border-color:rgba(255,184,0,.35)}
.verdict.b{background:rgba(255,77,94,.1);border-color:rgba(255,77,94,.35)}

/* ===== cosmetics ===== */

.un-fire{background:linear-gradient(0deg,#ff3d00,#ff9100,#ffea00,#ff9100,#ff3d00);background-size:100% 300%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:unfire 1.2s linear infinite;filter:drop-shadow(0 0 6px rgba(255,120,0,.7))}

.un-gold{background:linear-gradient(100deg,#b8860b 0%,#ffd700 30%,#fff6c2 45%,#ffd700 60%,#b8860b 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:unflow 2.2s linear infinite}

.bdg{display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:7px;margin-inline-end:5px;vertical-align:1px;line-height:1.5;white-space:nowrap}

.coin{display:inline-flex;align-items:center;gap:5px;font-weight:800}
.coin i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c2,#ffd700 45%,#c08a00);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);display:inline-block}
.wallet{border-radius:26px;padding:20px;background:linear-gradient(135deg,#2a1d5c,#5a1f4f 60%,#6b3a10);position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.12)}

.vipcard{border-radius:24px;padding:18px;margin-top:12px;background:linear-gradient(130deg,#3b2a00,#7a5200 50%,#2a1a00);border:1px solid rgba(255,215,0,.45);position:relative;overflow:hidden}

.gbanner{position:absolute;z-index:9;left:50%;top:calc(var(--st) + 120px);transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px 18px 10px 10px;border-radius:99px;
  background:linear-gradient(120deg,rgba(124,92,255,.9),rgba(255,77,141,.9));box-shadow:0 10px 40px rgba(255,77,141,.5);animation:gbin .5s cubic-bezier(.2,1.4,.4,1);white-space:nowrap;font-weight:700}

@keyframes entrr{0%{transform:translateX(120%)}12%,85%{transform:none;opacity:1}100%{opacity:0}}

.scard.top2{border-color:rgba(220,230,240,.5);background:linear-gradient(160deg,rgba(220,230,240,.12),var(--card))}
.scard.top3{border-color:rgba(224,145,90,.5);background:linear-gradient(160deg,rgba(224,145,90,.14),var(--card))}
.stop{font-weight:900;font-size:14px;margin-bottom:10px;text-align:center}
.srk{text-align:center;min-width:62px}.srk b{display:block;font-size:20px}.srk span{font-size:10.5px;color:var(--mut)}
.ftop{box-shadow:0 0 0 2px rgba(255,215,0,.7),0 10px 40px rgba(255,215,0,.25)}
.ftop2{box-shadow:0 0 0 2px rgba(220,230,240,.6),0 10px 30px rgba(220,230,240,.15)}
.ftop3{box-shadow:0 0 0 2px rgba(224,145,90,.6),0 10px 30px rgba(224,145,90,.2)}
.ctop{box-shadow:0 0 0 1.5px rgba(255,215,0,.55)}.ctop2{box-shadow:0 0 0 1.5px rgba(220,230,240,.5)}.ctop3{box-shadow:0 0 0 1.5px rgba(224,145,90,.55)}
.fmedal{position:absolute;z-index:3;top:10px;inset-inline-end:10px;padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);font-weight:900;font-size:12px}
.fmedal.sm{padding:3px 7px;top:8px;inset-inline-end:8px;font-size:14px}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin-top:14px}
.pd{text-align:center;position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.pd .pm{font-size:30px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
.pd.p1 .pm{font-size:40px;animation:bob 2s ease-in-out infinite}
.pd .pn{font-weight:800;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd .px{font-size:11px;color:var(--mut)}
.pd .pl{position:absolute;top:44px}
.pd .pbase{width:100%;margin-top:6px;border-radius:14px 14px 6px 6px;font-weight:900;font-size:22px;display:grid;place-items:center}
.pd.p1 .pbase{height:86px;background:linear-gradient(180deg,#ffd700,#b8860b);color:#3a2600}
.pd.p2 .pbase{height:64px;background:linear-gradient(180deg,#e6edf5,#8d99a8);color:#1d2530}
.pd.p3 .pbase{height:50px;background:linear-gradient(180deg,#f0a874,#9a4f1f);color:#2c1406}
@keyframes bob{50%{transform:translateY(-6px)}}
.perks{padding:12px 14px;display:flex;flex-direction:column;gap:9px;font-size:13.5px;line-height:1.6}
.lvup.slv{position:fixed;z-index:31;background:linear-gradient(120deg,#ffd700,#ff4d8d,#7c5cff)}

.lvup.slv b{background:none!important;-webkit-text-fill-color:#fff!important;color:#fff!important;text-shadow:0 3px 14px rgba(0,0,0,.35)}

/* ================= COSMETICS 2026 ================= */
/* ---- SVG badges ---- */
.bx{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:7px;margin-inline-end:5px;vertical-align:-4px;position:relative;flex:none;
  background:linear-gradient(140deg,var(--a),var(--b));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 4px rgba(0,0,0,.25),0 2px 8px color-mix(in srgb,var(--b) 55%,transparent);overflow:hidden}
.bx svg{width:70%;height:70%;fill:#fff;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35));position:relative;z-index:1}
.bx.r-r::after,.bx.r-e::after,.bx.r-l::after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.75) 50%,transparent 60%);animation:bxshine 2.8s ease-in-out infinite}
.bx.r-e{animation:bxglow 2s ease-in-out infinite}
.bx.r-l{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.75),inset 0 -2px 4px rgba(0,0,0,.25);animation:bxleg 2.4s linear infinite}

@keyframes bxshine{0%,55%{transform:translateX(-60%)}100%{transform:translateX(60%)}}

.bxbig .bx{width:44px;height:44px;border-radius:14px;margin:0 0 6px}
.item .pv{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}

/* ---- rarity chips & shop cards ---- */

.rar-c{background:rgba(255,255,255,.1);color:#cfcbe6}
.rar-r{background:rgba(0,170,255,.2);color:#7fd8ff}
.rar-e{background:rgba(170,90,255,.25);color:#d6b8ff}
.rar-l{background:linear-gradient(120deg,#ffd700,#ff8c00);color:#2b1600;box-shadow:0 0 10px rgba(255,190,0,.5)}
.item{position:relative}
.item.r-l{border-color:rgba(255,200,0,.45);background:linear-gradient(160deg,rgba(255,200,0,.09),var(--card))}
.item.r-e{border-color:rgba(170,90,255,.4);background:linear-gradient(160deg,rgba(170,90,255,.08),var(--card))}
.item.r-r{border-color:rgba(0,170,255,.3)}
.item .pv{padding-top:14px}
.fxfix{position:fixed!important;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}
.colgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;justify-items:center}
.fxb{position:relative}.fxb.fxs{border-color:rgba(170,90,255,.45)}
.fxb.lock{opacity:.55}.fxb .lk{position:absolute;top:6px;inset-inline-end:6px;width:14px;height:14px;opacity:.9}.fxb .lk svg{width:14px;height:14px}

/* ---- frames ---- */
.frm{display:inline-grid}

function waitIce(pc, ms = 1800) {
  if (pc.iceGatheringState === "complete") return Promise.resolve();
  return new Promise((res) => {
    const done = () => { pc.removeEventListener("icegatheringstatechange", chk); res(); };
    const chk = () => pc.iceGatheringState === "complete" && done();
    pc.addEventListener("icegatheringstatechange", chk);
    setTimeout(done, ms);
  });
}

class RoomWS {
  constructor(room, opts = {}) {
    this.room = room; this.opts = opts; this.handlers = new Set(); this.closed = false; this.tries = 0;
    this.open();
  }
  open() {
    const u = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + `/api/room/${this.room}/ws?token=${encodeURIComponent(S.token || "")}` + (this.opts.pub ? "&pub=1" : "");
    const ws = (this.ws = new WebSocket(u));
    ws.onopen = () => { this.tries = 0; this.ping = setInterval(() => this.send({ t: "ping", at: Date.now() }), 20000); };
    ws.onmessage = (e) => { let m; try { m = JSON.parse(e.data); } catch (x) { return; } this.handlers.forEach((f) => f(m)); };
    ws.onclose = () => {
      clearInterval(this.ping);
      if (this.closed) return;
      setTimeout(() => !this.closed && this.open(), Math.min(8000, 600 * 2 ** this.tries++));
    };
  }
  on(f) { this.handlers.add(f); }
  send(o) { if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(o)); }
  close() { this.closed = true; clearInterval(this.ping); try { this.ws.close(); } catch (e) {} }
}

/* ================= Stage (renders publishers' tracks) ================= */
class Stage {
  constructor(el, { muted = false } = {}) {
    this.el = el; this.sub = new Sub(); this.pubs = []; this.tiles = new Map(); this.cams = new Map(); this.audios = new Map();
    this.mode = "focus"; this.focus = null; this.muted = muted; this.tracks = new Map();
    this.sub.onTrack = (info, track) => { this.tracks.set(info.uid + ":" + info.role, track); this.attach(info, track); };
    this.ro = new ResizeObserver(() => this.layout()); this.ro.observe(el);
  }
  setPubs(list) {
    this.pubs = list || [];
    const want = [];
    for (const p of this.pubs) for (const tr of p.tracks || []) want.push({ uid: p.uid, role: tr.role, kind: tr.kind, sessionId: tr.sessionId, trackName: tr.trackName });
    const live = new Set(this.pubs.map((p) => p.uid));
    // remove gone publishers
    for (const [k, el] of this.tiles) if (!live.has(k)) { el.remove(); this.tiles.delete(k); }
    for (const [k, el] of this.cams) if (!live.has(k) || !want.find((w) => w.uid === k && w.role === "cam")) { el.remove(); this.cams.delete(k); }
    for (const [k, a] of this.audios) { const [uid, role] = k.split(":"); if (!want.find((w) => w.uid === uid && w.role === role)) { a.remove(); this.audios.delete(k); } }
    for (const p of this.pubs) this.ensureTile(p);
    this.sub.pull(want);
    this.layout();
  }
  ensureTile(p) {
    let el = this.tiles.get(p.uid);
    if (!el) {
      el = document.createElement("div");
      el.className = "vt";
      el.innerHTML = `<video playsinline autoplay muted></video><div class="spin"></div><div class="nm badge"></div>`;
      el.onclick = () => { if (this.pubs.length > 1) { this.focus = p.uid; this.layout(); } };
      this.el.appendChild(el);
      this.tiles.set(p.uid, el);
      const t = this.tracks.get(p.uid + ":screen"); if (t) this.attach({ uid: p.uid, role: "screen" }, t);
    }
    $(".nm", el).innerHTML = `${esc(p.name)}${p.role === "guest" ? " · " + t("guestTag") : ""}`;
    this.setPrivacy(p.uid, !!p.privacy, p.privacy && p.privacy.reason);
  }
  attach(info, track) {
    if (info.role === "screen") {
      const el = this.tiles.get(info.uid); if (!el) return;
      const v = $("video", el); v.srcObject = new MediaStream([track]); v.play().catch(() => {});
      v.onloadeddata = () => { const s = $(".spin", el); s && s.remove(); };
    } else if (info.role === "cam") {
      let c = this.cams.get(info.uid);
      if (!c) {
        c = document.createElement("div"); c.className = "cam"; c.innerHTML = `<video playsinline autoplay muted></video>`;
        this.el.appendChild(c); this.cams.set(info.uid, c); this.drag(c);
      }
      const v = $("video", c); v.srcObject = new MediaStream([track]); v.play().catch(() => {});
      this.layout();
    } else if (track.kind === "audio") {
      const k = info.uid + ":" + info.role;
      let a = this.audios.get(k);
      if (!a) { a = document.createElement("audio"); a.autoplay = true; a.setAttribute("playsinline", ""); this.el.appendChild(a); this.audios.set(k, a); }
      a.srcObject = new MediaStream([track]); a.muted = this.muted;
      a.play().catch(() => this.onBlocked && this.onBlocked());
    }
  }
  unmute() { this.muted = false; for (const a of this.audios.values()) { a.muted = false; a.play().catch(() => {}); } }
  setPrivacy(uid, on, reason) {
    const el = this.tiles.get(uid); if (!el) return;
    let o = $(".priv", el);
    if (!on) { o && o.remove(); return; }
    if (!o) { o = document.createElement("div"); o.className = "priv"; el.appendChild(o); }
    o.innerHTML = reason === "app"
      ? `<div class="lk" style="background:var(--grad)">${ic("game")}</div><b>${t("soonT")}</b><span>${t("soonS")}</span>`
      : `<div class="lk">${ic("lock")}</div><b>${t("privTitle")}</b><span>${t("privSub")}</span>`;
  }
  drag(el) {
    let sx, sy, ox, oy;
    el.addEventListener("pointerdown", (e) => { sx = e.clientX; sy = e.clientY; ox = el.offsetLeft; oy = el.offsetTop; el.setPointerCapture(e.pointerId); el.dataset.moved = "1"; });
    el.addEventListener("pointermove", (e) => { if (sx == null) return; el.style.left = ox + e.clientX - sx + "px"; el.style.top = oy + e.clientY - sy + "px"; });
    el.addEventListener("pointerup", () => (sx = null));
  }
  layout() {
    const W = this.el.clientWidth, H = this.el.clientHeight;
    const order = this.pubs.map((p) => p.uid);
    const n = order.length;
    if (!n) return;
    const host = (this.pubs.find((p) => p.role === "host") || this.pubs[0]).uid;
    const main = this.focus && order.includes(this.focus) ? this.focus : host;
    const set = (el, x, y, w, h, mini) => { Object.assign(el.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" }); el.classList.toggle("mini", !!mini); };
    if (this.mode === "split" && n > 1) {
      const land = W > H;
      const cols = land ? Math.min(n, n > 2 ? 2 : 2) : n > 2 ? 2 : 1;
      const rows = Math.ceil(n / cols);
      const w = W / cols, h = H / rows;
      order.forEach((uid, i) => { const el = this.tiles.get(uid); el && set(el, (i % cols) * w, Math.floor(i / cols) * h, w, h, false); });
    } else {
      const others = order.filter((u) => u !== main);
      const mel = this.tiles.get(main); mel && set(mel, 0, 0, W, H, false);
      const mw = Math.min(150, W * 0.3), mh = mw * 1.4;
      others.forEach((uid, i) => { const el = this.tiles.get(uid); el && set(el, W - mw - 12, (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--st")) || 0) + 70 + i * (mh + 10), mw, mh, true); });
    }
    // camera bubbles: default bottom corner unless dragged
    let i = 0;
    for (const [, c] of this.cams) { if (!c.dataset.moved) { c.style.left = (document.dir === "rtl" ? W - 124 - i * 120 : 12 + i * 120) + "px"; c.style.top = H * 0.52 + "px"; } i++; }
  }
  destroy() { this.ro.disconnect(); this.sub.close(); this.el.innerHTML = ""; }
}

/* ---------- game catalog ---------- */
const Games = {
  top: null, phone: null,
  async loadTop() { if (this.top) return this.top; const r = await api("/api/games/top"); this.top = (r.items || []).slice(0, 40); return this.top; },
  async search(q) {
    const [loc, store] = await Promise.all([api("/api/games/search?q=" + encodeURIComponent(q)).then((r) => r.items || []), this.appStore(q)]);
    const seen = new Set(); return [...loc, ...store].filter((g) => !seen.has(g.id) && seen.add(g.id));
  },
  // App Store search straight from the phone (JSONP — avoids the shared-IP rate limit on the server)
  appStore(q) {
    return new Promise((res) => {
      const cb = "__it" + Math.random().toString(36).slice(2);
      const sc = document.createElement("script");
      const done = (list) => { delete window[cb]; sc.remove(); clearTimeout(to); res(list); };
      const to = setTimeout(() => done([]), 6000);
      window[cb] = (j) => done((j.results || []).filter((a) => (a.genreIds || []).includes("6014")).map((a) => ({ id: String(a.trackId), name: a.trackName, icon: a.artworkUrl512 || a.artworkUrl100 })));
      sc.onerror = () => done([]);
      sc.src = `https://itunes.apple.com/search?entity=software&limit=25&country=${S.lang === "ar" ? "sa" : "us"}&term=${encodeURIComponent(q)}&callback=${cb}`;
      document.head.appendChild(sc);
    });
  },
  phoneList() {
    if (!isAndroid()) return Promise.resolve([]);
    if (this.phone) return Promise.resolve(this.phone);
    return new Promise((res) => {
      const off = Native.on((e) => { if (e.type === "games") { off(); this.phone = e.list || []; res(this.phone); } });
      Native.post("games", {});
      setTimeout(() => { off(); res(this.phone || []); }, 4000);
    });
  },
};

function countryName(cc) {
  if (!cc || cc.length !== 2) return "–";
  const flag = String.fromCodePoint(...[...cc.toUpperCase()].map((c) => 127397 + c.charCodeAt(0)));
  let name = cc;
  try { name = new Intl.DisplayNames([S.lang === "ar" ? "ar" : "en"], { type: "region" }).of(cc.toUpperCase()) || cc; } catch (e) {}
  return flag + " " + name;
}

  root.innerHTML = `<div class="view"><div class="top"><button class="ibtn" id="sb">${ic("back")}</button><div class="h1">${t("speedTest")}</div></div>

      <div class="v"><b id="gv">–</b><span id="gu">${t("mbps")}</span><span id="gs" style="margin-top:6px"></span></div></div>
    <div class="sres">

      <div class="kpi"><span class="small">${t("jitter")}</span><br><b id="rj">–</b> <span class="small">${t("ms")}</span></div>
      <div class="kpi"><span class="small">${t("down")}</span><br><b id="rd">–</b> <span class="small">${t("mbps")}</span></div>
      <div class="kpi"><span class="small">${t("up")}</span><br><b id="ru">–</b> <span class="small">${t("mbps")}</span></div>
    </div>
    <div class="tile row" style="margin-top:12px">${ic("globe")}<span class="mut">${t("server")}</span><span class="sp"></span><b id="rs">–</b></div>
    <div id="sv"></div>
    <button class="btn p" id="sgo" style="margin-top:16px">${ic("gauge")} ${t("sStart")}</button>
  </div></div>`;
  $("#sb").onclick = () => go(S.token ? "me" : "home");
  let alive = true;
  const setG = (v, max, unit) => { $("#gv").textContent = v < 10 ? v.toFixed(1) : Math.round(v); $("#gu").textContent = unit; $("#garc").setAttribute("stroke-dasharray", `${ARC * Math.min(1, Math.log10(1 + v) / Math.log10(1 + max))} ${C}`); };
  const run = async () => {
    const b = $("#sgo"); b.disabled = true; $("#sv").innerHTML = "";
    ["rp", "rj", "rd", "ru"].forEach((i) => ($("#" + i).textContent = "–"));
    // ping
    $("#gs").textContent = t("sPing");
    const pings = []; let colo = "";
    for (let i = 0; i < 12 && alive; i++) {
      const t0 = performance.now();
      const r = await fetch("/api/speed/ping?r=" + Math.random(), { cache: "no-store" }).then((x) => x.json()).catch(() => null);
      const dt = performance.now() - t0;
      if (r) { colo = r.country || ""; if (i > 1) pings.push(dt); setG(dt, 300, t("ms")); }
    }
    const ping = Math.min(...pings), jit = pings.length > 1 ? pings.slice(1).reduce((a, x, i) => a + Math.abs(x - pings[i]), 0) / (pings.length - 1) : 0;
    $("#rp").textContent = Math.round(ping); $("#rj").textContent = Math.round(jit); $("#rs").textContent = countryName(colo);
    // download (parallel streams, ~8s)
    $("#gs").textContent = t("sDown");
    let got = 0; const tD = performance.now(); let stop = false;
    const dl = async () => { while (!stop && alive) { const r = await fetch("/api/speed/down?bytes=8000000&r=" + Math.random(), { cache: "no-store" }); const rd = r.body.getReader(); for (;;) { const { done, value } = await rd.read(); if (done || stop) { if (stop) rd.cancel().catch(() => {}); break; } got += value.length; } } };
    const tick = setInterval(() => setG((got * 8) / ((performance.now() - tD) / 1000) / 1e6, 1000, t("mbps")), 200);
    const ws = [dl(), dl(), dl(), dl()];
    await sleep(8000); stop = true; clearInterval(tick); await Promise.allSettled(ws);
    const down = (got * 8) / ((performance.now() - tD) / 1000) / 1e6;
    $("#rd").textContent = down.toFixed(1);
    // upload (parallel, ~8s)
    $("#gs").textContent = t("sUp");
    const blob = new Blob([crypto.getRandomValues(new Uint8Array(65536))]);
    const parts = Array(32).fill(blob); const body = new Blob(parts); // 2 MB
    let sent = 0; const tU = performance.now(); stop = false;
    const ul = async () => { while (!stop && alive) { await fetch("/api/speed/up", { method: "POST", body, cache: "no-store" }).catch(() => {}); if (!stop) sent += body.size; } };
    const tick2 = setInterval(() => setG((sent * 8) / ((performance.now() - tU) / 1000) / 1e6, 1000, t("mbps")), 200);
    const us = [ul(), ul(), ul()];
    await sleep(8000); stop = true; clearInterval(tick2); await Promise.allSettled(us);
    const up = (sent * 8) / ((performance.now() - tU) / 1000) / 1e6;
    $("#ru").textContent = up.toFixed(1);
    setG(up, 1000, t("mbps") + " ↑");
    $("#gs").textContent = "";
    const q = up >= 8 ? "1080p 60" : up >= 5 ? "720p 60" : up >= 3 ? "720p 30" : up >= 1.8 ? "540p" : "";
    $("#sv").innerHTML = `<div class="verdict ${up >= 5 && ping < 120 ? "" : up >= 1.8 ? "w" : "b"}">${q ? t(up >= 5 && ping < 120 ? "vGreat" : "vOk", { q }) : t("vBad")}</div>`;
    b.disabled = false; b.innerHTML = ic("refresh") + " " + t("sAgain");
    haptic("success");
  };
  $("#sgo").onclick = run;
  run();
  return () => { alive = false; };
};

    data.forEach((s) => { if (!s.game) return; const k = s.game.toLowerCase(); const g = gm.get(k) || { name: s.game, icon: s.gameIcon, n: 0 }; g.n++; if (!g.icon) g.icon = s.gameIcon; gm.set(k, g); });
    const games = [...gm.values()].sort((a, b) => b.n - a.n);
    $("#hg").innerHTML = games.length ? `<div class="h2" style="margin-top:14px">${ic("game")} ${t("nowPlaying")}</div><div class="chips">${games.map((g) => `<button class="chip gchip ${gameF === g.name.toLowerCase() ? "on" : ""}" data-g="${esc(g.name.toLowerCase())}">${g.icon ? gIcon(g.icon) : "🎮"}<span>${esc(g.name)}</span><b>${g.n}</b></button>`).join("")}</div>` : "";
    $$("#hg [data-g]").forEach((b) => (b.onclick = () => { gameF = gameF === b.dataset.g ? "" : b.dataset.g; haptic(); render(); }));
    let list = data.filter((s) => (cat === "all" || s.cat === cat) && (!gameF || (s.game || "").toLowerCase() === gameF));
    if (tab === "fol") list = list.filter((s) => s.followed);
    const el = $("#hl");
    if (!list.length) {
      el.innerHTML = `<div class="empty"><div class="big">📡</div><div style="font-weight:700;font-size:17px;color:var(--txt)">${t("noLive")}</div><div style="margin-top:6px">${t("beFirst")}</div>
        <button class="btn p" style="margin-top:20px;width:auto;padding:14px 26px;display:inline-flex" id="hgo">${ic("live")} ${t("goLive")}</button></div>`;
      $("#hgo").onclick = () => go("golive");
      return;
    }
    const [f, ...rest] = list;
    el.innerHTML = card(f, true) + (rest.length ? `<div class="h2">${ic("zap")} ${t("liveNow")}</div><div class="grid">${rest.map((s) => card(s)).join("")}</div>` : "");
    $$("[data-id]", el).forEach((c) => (c.onclick = () => { haptic(); go("watch", c.dataset.id); }));
  };
  const load = async () => { const r = await api("/api/live"); if (r.streams) { data = r.streams; render(); } else if (!data.length) render(); };
  $$("#ht button").forEach((b) => (b.onclick = () => { tab = b.dataset.t; $$("#ht button").forEach((x) => x.classList.toggle("on", x === b)); render(); }));
  $$("#hc .chip").forEach((b) => (b.onclick = () => { cat = b.dataset.c; $$("#hc .chip").forEach((x) => x.classList.toggle("on", x === b)); render(); }));
  $("#hr").onclick = () => { haptic(); load(); };
  $("#hrk").onclick = () => go("ranks");
  load();
  const iv = setInterval(load, 15000);
  return () => clearInterval(iv);
};

function pickPhoto(cb) {
  const i = document.createElement("input"); i.type = "file"; i.accept = "image/*";
  i.onchange = () => {
    const f = i.files && i.files[0]; if (!f) return;
    const img = new Image();
    img.onload = () => {
      const S2 = 320, c = document.createElement("canvas"); c.width = c.height = S2;
      const m = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S2, S2);
      cb(c.toDataURL("image/jpeg", 0.82)); URL.revokeObjectURL(img.src);
    };
    img.onerror = () => toast(terr("bad_image"));
    img.src = URL.createObjectURL(f);
  };
  i.click();
}

  const sw = (id, on) => `<div class="sw ${on ? "on" : ""}" data-s="${id}"></div>`;
  const row = (icn, title, sub, right, id = "") => `<div class="tg" ${id ? `id="${id}"` : ""}><div class="ic">${ic(icn)}</div><div class="tx"><b>${title}</b>${sub ? `<span>${sub}</span>` : ""}</div>${right || ""}</div>`;
  const seg = (id, opts, val) => `<div class="seg" data-seg="${id}" style="margin:2px 0 12px">${opts.map(([v, l]) => `<button class="${String(v) === String(val) ? "on" : ""}" data-v="${v}">${l}</button>`).join("")}</div>`;
  const sec = (title, body) => `<div class="h2">${title}</div><div class="tile" style="padding:4px 14px">${body}</div>`;
  root.innerHTML = `<div class="view"><div class="top"><button class="ibtn" id="xb">${ic("back")}</button><div class="h1">${t("settingsT")}</div></div>
  <div class="scroll" style="padding-bottom:calc(40px + var(--sb))">
    ${u ? `<div class="sm" style="align-items:center;padding:14px;margin-top:4px" id="xme">${avatar(u, "md")}<div class="tx"><b>${esc(u.name)}</b><br><span class="mut small" dir="ltr">@${esc(u.handle)}</span></div><span class="mut">›</span></div>` : ""}
    ${u ? sec(t("secAccount"),
      row("user", t("editProfile"), "", `<span class="mut">›</span>`, "xedit") +
      row("lock", t("changePass"), "", `<span class="mut">›</span>`, "xpw") +
      row("out", t("logout"), "", "", "xout") +
      `<div class="tg" id="xdel" style="color:#ff7b88"><div class="ic">${ic("x")}</div><div class="tx"><b>${t("deleteAcc")}</b></div></div>`) : ""}
    ${sec(t("secStream"),
      `<div style="padding-top:12px"><label class="small mut">${t("quality")}</label></div>${seg("quality", [["540", "540p"], ["720", "720p"], ["1080", "1080p"]], g.quality)}
       <label class="small mut">${t("fps")}</label>${seg("fps", [[30, "30"], [60, "60"]], g.fps)}` +
      row("mic", t("mic"), t("micD"), sw("mic", g.mic)) +
      row("chat", t("chatOverlayDef"), "", sw("overlay", store.get("overlay", true))) +
      row("phone", t("callG"), t("callGD"), sw("callGuard", g.privacy.callGuard)) +
      (isAndroid() || !Native.has() ? row("bell", t("dnd"), t("dndD"), sw("dnd", g.privacy.dnd)) : "") +
      (isIOS() || !Native.has() ? row("eye", t("bannerG"), t("bannerGD"), sw("bannerGuard", g.privacy.bannerGuard)) : "") +
      (isIOS() ? row("bell", t("focusGuide"), "", `<span class="mut">›</span>`, "xfocus") : "") +
      row("gauge", t("speedTest"), "", `<span class="mut">›</span>`, "xspeed"))}
    ${u ? sec(t("modT"), row("shield", t("mods") + " · " + t("vipsR") + " · " + t("sanctions"), "", `<span class="mut">›</span>`, "xmods")) : ""}
    ${u ? sec(t("yt"), row("live", t("ytAdd"), u.yt ? t("ytLinked", { k: `<span dir="ltr">${esc(u.yt)}</span>` }) : t("ytNot"), `<span class="mut">›</span>`, "xyt")) : ""}
    ${u ? sec(t("recordings"),
      row("live", t("recSave"), t("recSaveD"), sw("rec", rp.rec)) +
      row("layers", t("storage"), `<span id="xstor">…</span>`, "") +
      `<div class="tg" id="xdelall" style="color:#ff7b88"><div class="ic">${ic("x")}</div><div class="tx"><b>${t("delAllRecs")}</b></div></div>`) : ""}
    ${u ? sec(t("secRoom"),
      row("spark", t("allowFx"), t("allowFxD"), sw("allowFx", rp.allowFx)) +
      row("trophy", t("allowCh"), "", sw("allowCh", rp.allowCh)) +
      `<div style="padding-top:12px"><label class="small mut">${t("coStreamWho")}</label></div>${seg("coStream", [["all", t("everyone")], ["followers", t("followersOnly")], ["none", t("nobody")]], rp.coStream)}
       <label class="small mut">${t("slowMode")}</label>${seg("slow", [[0, t("off")], [5, "5" + t("secs")], [15, "15" + t("secs")], [30, "30" + t("secs")]], rp.slow)}`) : ""}
    ${sec(t("secWatch"),
      row("chat", t("chatOnStream"), "", sw("p:chatOnStream", P.chatOnStream)) +
      row("vol", t("autoSound"), "", sw("p:autoSound", P.autoSound)) +
      row("spark", t("fxSound"), "", sw("p:fxSound", P.fxSound)) +
      row("zap", t("reduceFx"), t("reduceFxD"), sw("p:reduceFx", P.reduceFx)) +
      row("gauge", t("showLat"), "", sw("p:showLat", P.showLat)))}
    ${u ? sec(t("secNotif"), row("mail", t("notifyMail"), t("notifyMailD"), sw("notify", u.notify !== false))) : ""}
    ${sec(t("secApp"),
      row("globe", t("language"), S.lang === "ar" ? "العربية" : "English", `<span class="mut">⇄</span>`, "xlang") +
      (Native.has() ? row("zap", t("haptics"), "", sw("p:haptics", P.haptics)) : "") +
      row("refresh", t("clearCache"), "", "", "xcache"))}
    ${sec(t("secAbout"), row("live", "Wahj Live", t("version") + " " + esc((S.native && S.native.version) || "web"), ""))}
  </div></div>`;
  $("#xb").onclick = () => go(S.token ? "me" : "home");
  const saveG = () => store.set("golive", g);
  let rpT;
  const saveRoom = () => { clearTimeout(rpT); rpT = setTimeout(async () => { const r = await api("/api/profile", { prefs: rp }); if (r.user) { S.user = r.user; store.set("user", r.user); } }, 400); };
  $$("[data-s]", root).forEach((el) => (el.onclick = async () => {
    const on = el.classList.toggle("on"); haptic();
    const k = el.dataset.s;
    if (k.startsWith("p:")) return setP(k.slice(2), on);
    if (k === "mic") g.mic = on, saveG();
    else if (k === "overlay") store.set("overlay", on);
    else if (["callGuard", "dnd", "bannerGuard"].includes(k)) { g.privacy[k] = on; saveG(); if (k === "dnd" && on && isAndroid()) Native.post("perm", { kind: "dnd" }); }
    else if (k === "allowFx" || k === "allowCh" || k === "rec") { rp[k] = on; saveRoom(); }
    else if (k === "notify") { const r = await api("/api/profile", { notify: on }); if (r.user) { S.user = r.user; store.set("user", r.user); } }
  }));
  $$("[data-seg]", root).forEach((sg) => $$("button", sg).forEach((b) => (b.onclick = () => {
    $$("button", sg).forEach((x) => x.classList.toggle("on", x === b)); haptic();
    const k = sg.dataset.seg, v = b.dataset.v;
    if (k === "quality") g.quality = v, saveG();
    else if (k === "fps") g.fps = +v, saveG();
    else { rp[k] = k === "slow" ? +v : v; saveRoom(); }
  })));
  const on = (id, f) => { const e = $("#" + id); if (e) e.onclick = f; };
  on("xme", () => go("me"));
  on("xyt", () => ytSheet(() => go("settings")));
  on("xmods", () => modsManager(S.user.id));
  on("xdelall", () => deleteRec("all", () => go("settings")));
  if (u) api("/api/recs").then((r) => { const el = $("#xstor"); if (el) el.textContent = r.myBytes !== undefined ? `${fmtBytes(r.myBytes)} · ${r.recs.length} ${t("recordings")}` : "–"; });
  if (u && !(S.cfg && S.cfg.rec)) api("/api/config").then((c) => { if (!c.rec && $("#xstor")) $("#xstor").textContent = t("recOff"); });
  on("xedit", editProfile);
  on("xspeed", () => go("speed"));
  on("xfocus", focusGuide);
  on("xlang", () => { S.lang = S.lang === "ar" ? "en" : "ar"; store.set("lang", S.lang); applyLang(); Native.post("lang", { lang: S.lang }); go("settings"); });
  on("xcache", () => { const keep = ["token", "user", "lang", "prefs", "golive", "overlay"]; Object.keys(localStorage).filter((k) => k.startsWith("wahj.") && !keep.includes(k.slice(5))).forEach((k) => localStorage.removeItem(k)); Games.top = null; Games.phone = null; toast(t("saved")); });
  on("xout", () => confirmBox(t("logout") + "?", () => { S.token = ""; S.user = null; store.set("token", ""); store.set("user", null); store.set("guest", false); Native.post("auth", { token: "" }); go("auth"); }));
  on("xpw", () => sheet(`<h3>${ic("lock")} ${t("changePass")}</h3><div class="field">${pwField("po", t("oldPass"))}</div><div class="field">${pwField("pn", t("newPass"))}</div><button class="btn p" id="ps">${t("save")}</button>`, (sh, close) => {
    bindEyes(sh);
    $("#ps", sh).onclick = async () => { const r = await api("/api/password", { old: $("#po", sh).value, password: $("#pn", sh).value }); if (r.error) return toast(terr(r.error)); close(); toast(t("saved")); };
  }));
  on("xdel", () => sheet(`<h3 style="color:#ff7b88">${t("deleteAcc")}</h3><p class="mut" style="margin-bottom:10px;line-height:1.7">${t("deleteQ")}</p><div class="field">${pwField("dp", t("password"))}</div><button class="btn d" id="dd">${t("deleteAcc")}</button>`, (sh, close) => {
    bindEyes(sh);
    $("#dd", sh).onclick = async () => { const r = await api("/api/delete-account", { password: $("#dp", sh).value }); if (r.error) return toast(terr(r.error)); close(); S.token = ""; S.user = null; store.set("token", ""); store.set("user", null); store.set("guest", false); toast(t("deleted")); go("auth"); };
  }));
};
function settingsSheet() { go("settings"); }

/* ---------- other user's profile ---------- */
VIEWS.user = (root, handle) => {
  if (S.user && handle === S.user.handle) return go("me");
  root.innerHTML = `<div class="view"><div class="top"><button class="ibtn" id="ub">${ic("back")}</button></div><div class="scroll" id="us"><div class="spin"></div></div></div>`;
  $("#ub").onclick = () => go("home");
  api("/api/user/" + encodeURIComponent(handle)).then((r) => {
    if (!r.user) return ($("#us").innerHTML = `<div class="empty">${t("offline")}</div>`);
    const u = r.user; let fol = S.following.has(u.id);
    $("#us").innerHTML = profileHtml(r, false);
    if (S.user) {
      $("#pact").innerHTML = `<div class="row" style="margin-top:14px"><button class="btn ${fol ? "g" : "p"}" id="uf">${fol ? t("unfollow") : t("follow")}</button>
        <button class="btn" id="usb" style="background:linear-gradient(120deg,#00d1ff,#7c5cff);color:#fff">${r.mySub ? t("subscribed", { n: r.mySub.months }) : t("subscribe")}</button></div>`;
      $("#usb").onclick = () => subSheet(u, (sub) => { $("#usb").textContent = t("subscribed", { n: sub.months }); });
      $("#uf").onclick = async () => { fol = !fol; const fb = $("#uf"); fb.className = "btn " + (fol ? "g" : "p"); fb.textContent = fol ? t("unfollow") : t("follow"); haptic(); await api("/api/follow", { target: u.id, on: fol }); fol ? S.following.add(u.id) : S.following.delete(u.id); };
    }
    bindStreams($("#us"), r, false);
  });
};

/* ================= diagnostics ================= */
function diag(msg, room) {
  try { fetch("/api/diag", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ src: "web-" + plat(), room: room || (S.live && S.live.room) || "", msg: String(msg).slice(0, 800) }) }).catch(() => {}); } catch (e) {}
}
window.addEventListener("error", (e) => diag("JS " + e.message + " @" + (e.filename || "").split("/").pop() + ":" + e.lineno));
Native.on((e) => { if (e.type === "broadcast" || e.type === "diag") diag("native " + JSON.stringify(e)); });

/* ================= boot ================= */
async function afterLogin() {
  const m = location.pathname.match(/^\/w\/([a-z0-9]+)/);
  if (S.live && S.bstate !== "idle") return go("studio");
  if (m) return go("watch", m[1]);
  go("home");
}
async function boot() {
  applyLang();
  Native.post("info", {});
  // wait briefly for native info
  for (let i = 0; i < 10 && Native.has() && !S.native; i++) await sleep(60);
  if (S.native && S.native.lang && !store.get("langSet", false)) { /* keep user choice */ }
  api("/api/config").then((c) => { S.cfg = c; if (c.ice) S.ice = c.ice; });
  // restore an ongoing broadcast after app reload
  const resume = store.get("live", null);
  if (resume && S.native && S.native.broadcasting && Date.now() - resume.startedAt < 12 * 3600e3) { S.live = resume; S.bstate = "live"; }
  if (S.token) {
    const r = await api("/api/me");
    if (r.user) { S.user = r.user; store.set("user", r.user); S.following = new Set(r.following || []); Native.post("auth", { token: S.token, user: r.user }); }
    else if (r.error === "auth") { S.token = ""; store.set("token", ""); }
  }
  const m = location.pathname.match(/^\/w\/([a-z0-9]+)/);
  if (!S.token && !store.get("guest", false) && !m) return go("auth");
  afterLogin();
}
// persist the live job so the studio survives a WebView reload
setInterval(() => store.set("live", S.live), 3000);
window.addEventListener("beforeunload", () => store.set("live", S.live));
window.Wahj = { go, S, Native, endLive, current: () => current }; // for native/debug
boot();
</script></body></html>
