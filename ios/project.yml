name: WahjLive
options:
  bundleIdPrefix: com.cruyfford
  deploymentTarget:
    iOS: "15.0"
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: "130.0.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WahjLive:
    type: application
    platform: iOS
    sources:
      - path: WahjLive
      - path: Shared
    dependencies:
      - package: WebRTC
      - target: WahjBroadcast
    settings:
      base:
        PRODUCT_NAME: WahjLive
        PRODUCT_BUNDLE_IDENTIFIER: com.cruyfford.wahj
        INFOPLIST_FILE: WahjLive/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  WahjBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: WahjBroadcast
      - path: Shared
    dependencies:
      - package: WebRTC
        embed: false
      - sdk: ReplayKit.framework
      - sdk: CallKit.framework
    settings:
      base:
        PRODUCT_NAME: WahjBroadcast
        PRODUCT_BUNDLE_IDENTIFIER: com.cruyfford.wahj.broadcast
        INFOPLIST_FILE: WahjBroadcast/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
schemes:
  WahjLive:
    build:
      targets:
        WahjLive: all
        WahjBroadcast: all
